<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AcxiomCRM Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="brand-mark">A</div>
    <h2>AcxiomCRM</h2>
    <p class="text-muted mb-4">Customer Relationship Management</p>
    <form id="loginForm">
      <label class="form-label">Email</label>
      <input id="loginEmail" type="email" class="form-control mb-3" value="admin@acxiomcrm.com" required>
      <label class="form-label">Password</label>
      <input id="loginPassword" type="password" class="form-control mb-3" value="Admin@123" minlength="8" required>
      <div id="loginError" class="text-danger small mb-2"></div>
      <button class="btn btn-primary w-100">Login</button>
    </form>
    <div class="demo-note mt-3">Demo: admin@acxiomcrm.com / Admin@123</div>
  </div>
</div>

<div id="app" class="d-none">
  <nav class="navbar navbar-dark topbar">
    <div class="container-fluid">
      <button class="btn btn-outline-light d-lg-none" id="menuBtn"><i class="bi bi-list"></i></button>
      <span class="navbar-brand fw-bold"><span class="brand-mini">A</span> AcxiomCRM</span>
      <div class="d-flex align-items-center gap-3">
        <span class="text-white-50 d-none d-md-inline"><i class="bi bi-person-circle"></i> Admin</span>
        <button id="logoutBtn" class="btn btn-sm btn-light">Logout</button>
      </div>
    </div>
  </nav>

  <div class="layout">
    <aside id="sidebar" class="sidebar">
      <div class="side-title">MAIN MENU</div>
      <button class="nav-link active" data-page="dashboard"><i class="bi bi-grid-1x2"></i> Dashboard</button>
      <button class="nav-link" data-page="customers"><i class="bi bi-people"></i> Customers</button>
      <button class="nav-link" data-page="leads"><i class="bi bi-person-lines-fill"></i> Leads</button>
      <button class="nav-link" data-page="opportunities"><i class="bi bi-graph-up-arrow"></i> Opportunities</button>
      <button class="nav-link" data-page="followups"><i class="bi bi-calendar-check"></i> Follow-Ups</button>
      <button class="nav-link" data-page="activities"><i class="bi bi-check2-square"></i> Activities</button>
      <button class="nav-link" data-page="users"><i class="bi bi-person-gear"></i> Users & Roles</button>
      <button class="nav-link" data-page="audit"><i class="bi bi-shield-check"></i> Audit Log</button>
      <button class="nav-link" data-page="reports"><i class="bi bi-bar-chart"></i> Reports</button>
    </aside>

    <main class="content">
      <div id="pageContent"></div>
    </main>
  </div>
</div>

<div class="modal fade" id="addModal" tabindex="-1">
  <div class="modal-dialog">
    <form class="modal-content" id="addForm">
      <div class="modal-header"><h5 id="modalTitle" class="modal-title">Add Record</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary">Save</button></div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="script.js"></script>
</body>
</html>
